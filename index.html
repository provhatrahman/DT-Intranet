<!DOCTYPE html>
<html lang="en" data-os-theme="macosx" data-os-platform="mac" data-os-mac-chrome="aqua" data-os-aqua-material="glass" style="background-color: #000">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Greenroom" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="The DAYTIMERS operating system for artists, bookings, and projects."
    />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Permissions-Policy" content="camera=(self)" />
    <!-- Disable pull-to-refresh and overscroll behaviors on mobile -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Cache control -->
    <meta http-equiv="Cache-Control" content="max-age=86400" />

    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />

    <!-- Preload critical fonts (used immediately on page load) -->
    <link rel="preload" href="/fonts/ChicagoKare-Regular.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/geneva-12.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/LucidaGrande.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Preload critical JSON data -->
    <link rel="preload" href="/data/filesystem.json" as="fetch" type="application/json" crossorigin />
    <link rel="preload" href="/data/applets.json" as="fetch" type="application/json" crossorigin />
    <link rel="preload" href="/data/ipod-videos.json" as="fetch" type="application/json" crossorigin />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://greenroom.daytimers.org/" />
    <meta property="og:title" content="Greenroom" />
    <meta
      property="og:description"
      content="The DAYTIMERS operating system for artists, bookings, and projects."
    />
    <meta property="og:image" content="https://greenroom.daytimers.org/icons/mac-512.png" />
    <meta property="og:site_name" content="Greenroom" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Greenroom" />
    <meta
      name="twitter:description"
      content="The DAYTIMERS operating system for artists, bookings, and projects."
    />
    <meta name="twitter:image" content="https://greenroom.daytimers.org/icons/mac-512.png" />

    <title>Greenroom</title>

    <!-- Stale bundle detection: reload if cached index.html references missing JS bundles -->
    <script>
      (function() {
        // Prevent infinite reload loops - only try once per page load
        var reloadKey = 'greenroom-stale-reload';
        var lastReload = sessionStorage.getItem(reloadKey);
        var now = Date.now();

        // If we reloaded in the last 10 seconds, don't reload again
        if (lastReload && (now - parseInt(lastReload, 10)) < 10000) {
          console.warn('[Greenroom] Recently reloaded for stale bundle, skipping to prevent loop');
          return;
        }

        // Guard to prevent multiple reload attempts
        var isReloading = false;

        // Listen for script load errors (captures ES module import failures)
        window.addEventListener('error', function(event) {
          if (isReloading) return;
          // Check if this is a script/module loading error
          var target = event.target || event.srcElement;

          // Handle <script> tag errors
          if (target && target.tagName === 'SCRIPT') {
            var src = target.src || '';
            // Check if it's our JS bundle from /assets/
            if (src.indexOf('/assets/') !== -1 && src.indexOf('.js') !== -1) {
              console.error('[Greenroom] Bundle failed to load:', src);
              triggerStaleReload('Script tag error: ' + src);
            }
          }
        }, true); // Use capture phase to catch errors before they propagate

        // Handle dynamic import failures (ES modules)
        window.addEventListener('unhandledrejection', function(event) {
          if (isReloading) return;
          var reason = event.reason;
          if (!reason) return;

          var message = reason.message || String(reason);
          var stack = reason.stack || '';

          // Check for module loading failures
          // Common error patterns:
          // - "Failed to fetch dynamically imported module" (Chrome)
          // - "error loading dynamically imported module" (Firefox)
          // - "Loading module from ... was blocked" (Safari)
          // - "Importing a module script failed" (Safari)
          // - "Unable to preload CSS" with chunk reference
          var isModuleError =
            message.indexOf('dynamically imported module') !== -1 ||
            message.indexOf('Loading module') !== -1 ||
            message.indexOf('module script failed') !== -1 ||
            message.indexOf('Unable to preload CSS') !== -1;

          // Also check if error is specifically about our assets
          // This catches Safari-specific errors that include the URL in the message
          var isAssetError =
            (message.indexOf('/assets/') !== -1 && message.indexOf('.js') !== -1) ||
            (stack.indexOf('/assets/') !== -1 && stack.indexOf('.js') !== -1);

          // Only trigger for module errors or asset-specific errors
          // Avoid triggering for general "Failed to fetch" from API calls
          if (isModuleError || isAssetError) {
            console.error('[Greenroom] Module import failed:', message);
            triggerStaleReload('Module import error: ' + message);
          }
        });

        function triggerStaleReload(reason) {
          if (isReloading) return;
          isReloading = true;

          console.warn('[Greenroom] Stale bundle detected, clearing caches and reloading...', reason);

          // Mark that we're reloading to prevent loops
          sessionStorage.setItem(reloadKey, String(Date.now()));

          // Clear all caches to ensure fresh assets
          if (window.caches) {
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(name) {
                return caches.delete(name);
              }));
            }).then(function() {
              console.log('[Greenroom] Caches cleared');
              doReload();
            }).catch(function() {
              doReload();
            });
          } else {
            doReload();
          }
        }

        function doReload() {
          // Unregister service worker to avoid serving stale HTML again
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistration().then(function(reg) {
              if (reg) {
                reg.unregister().then(function() {
                  console.log('[Greenroom] Service worker unregistered');
                  forceReload();
                }).catch(function() {
                  forceReload();
                });
              } else {
                forceReload();
              }
            }).catch(function() {
              forceReload();
            });
          } else {
            forceReload();
          }
        }

        function forceReload() {
          // Add cache-busting param to force fresh index.html fetch
          var url = new URL(window.location.href);
          url.searchParams.set('_cb', Date.now());
          window.location.replace(url.toString());
        }
      })();
    </script>
  </head>
  <body style="background-color: #000; margin: 0">
    <!-- First-paint theme bootstrap (ported from upstream ryOS main): sets
         data-os-theme/platform/mac-chrome/aqua-material/color-scheme on
         <html> from localStorage before React mounts, so the correct chrome
         (incl. dark mode) paints immediately instead of flashing the
         markup default (Aqua/Glass/light) set above. See
         src/themes/bootstrapConfig.ts (generates the config below) and
         src/stores/useThemeStore.ts (the same logic, applied post-mount). -->
    <script src="/theme-bootstrap-config.js"></script>
    <script>
      (function () {
        try {
          var rawTheme = localStorage.getItem("ryos:theme");
          var legacyTheme = localStorage.getItem("os_theme");
          if (!rawTheme && legacyTheme) {
            rawTheme = legacyTheme;
            localStorage.setItem("ryos:theme", legacyTheme);
          }
          if (legacyTheme !== null) localStorage.removeItem("os_theme");
          var config = window.__RYOS_THEME_BOOTSTRAP__ || {
            defaultTheme: "macosx",
            defaultAquaMaterial: "glass",
            themes: {
              system7: { platform: "mac", macChrome: "system7", supportsDarkMode: false },
              macosx: { platform: "mac", macChrome: "aqua", supportsDarkMode: true },
              xp: { platform: "windows", macChrome: null, supportsDarkMode: false },
              win98: { platform: "windows", macChrome: null, supportsDarkMode: false },
            },
          };
          var themeConfig = rawTheme && config.themes && config.themes[rawTheme];
          var theme = themeConfig ? rawTheme : config.defaultTheme || "macosx";
          themeConfig = config.themes && config.themes[theme];
          var root = document.documentElement;
          root.dataset.osTheme = theme;
          // Mirror the platform/chrome attributes the React store will set later so first paint matches.
          var platform = themeConfig && themeConfig.platform ? themeConfig.platform : "mac";
          root.dataset.osPlatform = platform;
          if (themeConfig && themeConfig.macChrome) {
            root.dataset.osMacChrome = themeConfig.macChrome;
          } else {
            delete root.dataset.osMacChrome;
          }
          // Aqua material is a separate preference from the OS theme. Preserve
          // explicit saved choices; default missing/invalid storage to Glass.
          var rawAquaMaterial = localStorage.getItem("ryos:theme:aqua-material");
          var aquaMaterial =
            rawAquaMaterial === "classic" || rawAquaMaterial === "glass"
              ? rawAquaMaterial
              : config.defaultAquaMaterial || "glass";
          if (theme === "macosx" && aquaMaterial === "glass") {
            root.dataset.osAquaMaterial = "glass";
          } else {
            delete root.dataset.osAquaMaterial;
          }
          // Dark mode is per-theme, only honored when the theme advertises support.
          // Match useThemeStore#effectiveDarkFor (string prefs + legacy booleans + system).
          var supportsDark = !!(themeConfig && themeConfig.supportsDarkMode);
          var systemDark = false;
          try {
            systemDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e0) {}

          var isDarkBoot = false;
          if (supportsDark) {
            try {
              var rawDark = localStorage.getItem("ryos:theme:dark");
              var pref = null;
              if (rawDark) {
                var parsedDark = JSON.parse(rawDark);
                if (
                  parsedDark &&
                  typeof parsedDark === "object" &&
                  parsedDark[theme] !== undefined &&
                  parsedDark[theme] !== null
                ) {
                  pref = parsedDark[theme];
                }
              }
              if (pref === true || pref === "dark") isDarkBoot = true;
              else if (pref === false || pref === "light") isDarkBoot = false;
              else isDarkBoot = systemDark;
            } catch (e1) {}

            if (isDarkBoot) {
              root.dataset.osColorScheme = "dark";
              root.style.colorScheme = "dark";
              root.classList.add("dark");
            }
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var theme = document.documentElement.dataset.osTheme || "macosx";
        var fontsByTheme = {
          macosx: [
            "/fonts/LucidaGrande.woff2",
            "/fonts/AquaKana.woff2",
          ],
          system7: [
            "/fonts/ChicagoKare-Regular.woff2",
            "/fonts/geneva-12.woff2",
            "/fonts/fusion-pixel-12px-proportional-ja.woff2",
          ],
          xp: [
            "/fonts/ms_sans_serif.woff2",
            "/fonts/ms_sans_serif_bold.woff2",
            "/fonts/fusion-pixel-12px-proportional-ja.woff2",
          ],
          win98: [
            "/fonts/ms_sans_serif.woff2",
            "/fonts/ms_sans_serif_bold.woff2",
            "/fonts/fusion-pixel-12px-proportional-ja.woff2",
          ],
        };
        (fontsByTheme[theme] || fontsByTheme.macosx).forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "font";
          link.type = "font/woff2";
          link.crossOrigin = "anonymous";
          link.href = href;
          document.head.appendChild(link);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
